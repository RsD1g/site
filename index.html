<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Табы</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="page">
    <h1 class="page__title">Наши направления</h1>

    <div class="tabs" role="tablist">
      <button class="tabs__btn tabs__btn--active" role="tab" data-tab="1">Дизайн</button>
      <button class="tabs__btn" role="tab" data-tab="2">Разработка</button>
      <button class="tabs__btn" role="tab" data-tab="3">Маркетинг</button>
    </div>

    <div class="tab-content">
      <section class="tab-panel tab-panel--active" data-panel="1">
        <img class="tab-panel__img" src="img/design.jpg" alt="Дизайн">
        <div class="card">
          <h2 class="card__title">Дизайн интерфейсов</h2>
          <p class="card__text">Создаём удобные и красивые интерфейсы для сайтов и приложений.</p>
          <button class="btn">Подробнее</button>
        </div>
      </section>

      <section class="tab-panel" data-panel="2">
        <img class="tab-panel__img" src="img/dev.jpg" alt="Разработка">
        <div class="card">
          <h2 class="card__title">Веб-разработка</h2>
          <p class="card__text">Пишем чистый код и собираем быстрые сайты под ключ.</p>
          <button class="btn">Подробнее</button>
        </div>
      </section>

      <section class="tab-panel" data-panel="3">
        <img class="tab-panel__img" src="img/marketing.jpg" alt="Маркетинг">
        <div class="card">
          <h2 class="card__title">Маркетинг</h2>
          <p class="card__text">Помогаем продвигать продукт и находить клиентов.</p>
          <button class="btn">Подробнее</button>
        </div>
      </section>
    </div>
  </main>

  <script src="script.js"></script>
</body>
</html>
